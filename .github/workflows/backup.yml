# Wöchentliche Datensicherung der D1-Datenbank als privates GitHub-Artefakt (90 Tage aufbewahrt).
# Zusätzlich bietet Cloudflare D1 "Time Travel" (Wiederherstellung auf einen Zeitpunkt der letzten Tage).
name: backup
on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx wrangler d1 export apex --remote --output apex-backup.sql && gzip apex-backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: apex-d1-${{ github.run_id }}
          path: apex-backup.sql.gz
          retention-days: 90
